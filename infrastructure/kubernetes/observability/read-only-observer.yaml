apiVersion: v1
kind: Namespace
metadata:
  name: vps-observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vps-observer
  namespace: vps-observability
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: vps-observer-token
  namespace: vps-observability
  annotations:
    kubernetes.io/service-account.name: vps-observer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vps-observer-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: vps-observer
    namespace: vps-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vps-observer-cluster-read
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vps-observer-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vps-observer-cluster-read
subjects:
  - kind: ServiceAccount
    name: vps-observer
    namespace: vps-observability
