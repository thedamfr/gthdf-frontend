apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gthdf-qualification-tls
  labels:
    app.kubernetes.io/name: gthdf
spec:
  secretName: gthdf-qualification-tls
  issuerRef:
    kind: Issuer
    name: letsencrypt-production-http01
  dnsNames:
    - staging.gthf.fr
    - staging-cms.gthf.fr
