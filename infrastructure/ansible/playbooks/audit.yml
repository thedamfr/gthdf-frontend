---
- name: Audit a shared GTHDF target cluster without mutation
  hosts: gthdf_staging
  become: false
  gather_facts: true
  vars:
    gthdf_namespace: gthdf-staging
    minimum_free_bytes: 6442450944
    required_ingress_class: public
    required_storage_class: microk8s-hostpath
  tasks:
    - name: Require the supported host platform
      ansible.builtin.assert:
        that:
          - ansible_facts.system == "Linux"
          - ansible_facts.distribution == "Ubuntu"
          - ansible_facts.architecture in ["x86_64", "amd64"]
        fail_msg: GTHDF staging currently supports only Ubuntu on amd64.

    - name: Select the root filesystem facts
      ansible.builtin.set_fact:
        root_mount: "{{ ansible_facts.mounts | selectattr('mount', 'equalto', '/') | first }}"

    - name: Require enough free staging disk
      ansible.builtin.assert:
        that:
          - root_mount.size_available | int >= minimum_free_bytes
        fail_msg: The host needs at least 6 GiB free before a GTHDF staging build or rollout.

    - name: Collect MicroK8s status
      ansible.builtin.command:
        argv: [microk8s, status, --format, yaml]
      changed_when: false
      register: microk8s_status

    - name: Collect Kubernetes node status
      ansible.builtin.command:
        argv: [microk8s, kubectl, get, nodes, -o, json]
      changed_when: false
      register: kubernetes_nodes

    - name: Read the required ingress class
      ansible.builtin.command:
        argv: [microk8s, kubectl, get, ingressclass, "{{ required_ingress_class }}", -o, name]
      changed_when: false

    - name: Read the cert-manager API resources
      ansible.builtin.command:
        argv: [microk8s, kubectl, api-resources, --api-group=cert-manager.io, -o, name]
      changed_when: false
      register: cert_manager_resources

    - name: Require the cert-manager certificate and issuer APIs
      ansible.builtin.assert:
        that:
          - "'certificates.cert-manager.io' in cert_manager_resources.stdout_lines"
          - "'issuers.cert-manager.io' in cert_manager_resources.stdout_lines"
        fail_msg: The cert-manager APIs required by the namespaced GTHDF issuer are unavailable.

    - name: Read the required storage class
      ansible.builtin.command:
        argv: [microk8s, kubectl, get, storageclass, "{{ required_storage_class }}", -o, name]
      changed_when: false

    - name: Inspect the isolated GTHDF namespace
      ansible.builtin.command:
        argv: [microk8s, kubectl, get, namespace, "{{ gthdf_namespace }}", -o, name]
      changed_when: false
      failed_when: false
      register: gthdf_namespace_result

    - name: Show the non-secret staging readiness summary
      ansible.builtin.debug:
        msg:
          host: "{{ ansible_facts.hostname }}"
          memory_mb: "{{ ansible_facts.memtotal_mb }}"
          root_free_bytes: "{{ root_mount.size_available }}"
          microk8s_running: "{{ 'running: True' in microk8s_status.stdout }}"
          node_count: "{{ (kubernetes_nodes.stdout | from_json)['items'] | length }}"
          gthdf_namespace_present: "{{ gthdf_namespace_result.rc == 0 }}"
